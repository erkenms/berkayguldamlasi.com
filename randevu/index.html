<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3f4f5" />
  <meta name="description" content="Diş Hekimi Barış Berkay Güldamlası için online randevu talebinizi oluşturun." />

  <title>Online Randevu | Diş Hekimi Barış Berkay Güldamlası</title>
  <meta property="og:title" content="Online Randevu | Diş Hekimi Barış Berkay Güldamlası" />
  <meta property="og:description" content="Diş Hekimi Barış Berkay Güldamlası için online randevu talebinizi oluşturun." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://randevu.dtberkayguldamlasi.com/" />
  <meta property="og:image" content="https://dtberkayguldamlasi.com/IMG/berkay-baris-guldamlasi.jpg" />

  <link rel="canonical" href="https://randevu.dtberkayguldamlasi.com/" />
  <link rel="icon" href="https://dtberkayguldamlasi.com/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="preconnect" href="https://online.dentsoft.com.tr" />

  <style>
    :root {
      color-scheme: light;
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #2b2e33;
      background: #f3f4f5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-text-size-adjust: 100%;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
    }

    .page-header {
      padding: 22px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: #fff;
      border-bottom: 1px solid #e1e3e6;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand img {
      display: block;
      width: 214px;
      height: 72px;
      object-fit: cover;
    }

    h1,
    .home-link {
      margin: 0;
      font-family: "Manrope", sans-serif;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .home-link,
    .fallback-link {
      color: inherit;
      text-decoration: none;
    }

    .home-link {
      flex-shrink: 0;
    }

    .home-link:hover,
    .fallback-link:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    main {
      width: 100%;
    }

    .booking-frame {
      display: block;
      width: 100%;
      height: calc(100vh - 117px);
      height: calc(100dvh - 117px);
      min-height: 600px;
      border: 0;
      background: #fff;
    }

    .fallback {
      margin: 0;
      padding: 12px 20px;
      color: #6a6f76;
      text-align: center;
      font-size: 13px;
    }

    .fallback-link {
      color: #2b2e33;
    }

    @media (max-width: 1150px) {
      .page-header {
        padding: 20px 28px;
      }
    }

    @media (max-width: 760px) {
      .page-header {
        padding: 14px 20px;
      }

      .brand img {
        width: 155px;
        height: 52px;
      }

      .booking-frame {
        height: calc(100vh - 81px);
        height: calc(100dvh - 81px);
      }
    }

    @media (max-width: 560px) {
      .page-header {
        gap: 12px;
      }

      .brand {
        gap: 10px;
      }

    }

    @media (max-width: 380px) {
      .brand {
        gap: 6px;
      }

      h1 {
        max-width: 60px;
      }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="brand">
      <a href="https://dtberkayguldamlasi.com/" aria-label="Barış Berkay Güldamlası ana sayfa">
        <img src="https://dtberkayguldamlasi.com/IMG/logo.png" alt="Barış Berkay Güldamlası Diş Hekimi" />
      </a>
      <h1>Online Randevu</h1>
    </div>
    <a class="home-link" href="https://dtberkayguldamlasi.com/">Ana sayfa</a>
  </header>

  <main>
    <iframe
      class="booking-frame"
      src="https://online.dentsoft.com.tr/#4150577152"
      title="Diş Hekimi Barış Berkay Güldamlası online randevu formu"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <p class="fallback">
      Randevu formu görünmüyor mu?
      <a class="fallback-link" href="https://online.dentsoft.com.tr/#4150577152" target="_blank" rel="noopener noreferrer">Randevu sayfasını ayrı pencerede açın.</a>
    </p>
  </main>
</body>
</html>
